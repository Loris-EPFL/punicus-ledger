name: CI

on:
  # Scope push to main + release tags so a branch push that also has an open PR
  # doesn't build twice (the PR is covered by pull_request below).
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # pull_request unscoped (any base branch), like the other workflows: a part PR
  # of a multi-PR plan targets its feature branch and still needs Build and Test
  # (CLAUDE.md, "Multi-PR plans").
  pull_request:
  # The merge queue (owner's request, 2026-11-25): Build and Test runs again on
  # the commit the queue tests, which is the PR merged onto main and onto the
  # PRs queued ahead of it, and the queue holds the PR out of main until it is
  # green. Each entry runs in a group of its own (below), so none is cancelled.
  merge_group:

# A new push to a PR cancels that PR's run still building the commit it replaced
# (owner's request, 2026-11-18): only the head's result counts, and the
# Screenshots workflow's commit lands minutes after each push that changes a
# screen. A push to main or a tag gets a group of its own run, so none of their
# commits loses its result: in a shared group, even with cancel-in-progress
# off, GitHub cancels a run that is still pending when a newer one queues.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: :ui stamps the app's on-screen version from the nearest
          # v* tag, and `git tag --merged HEAD` needs HEAD's history to REACH that tag.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Robust Gradle dependency + plugin caching. Restores the base-branch cache
      # (read-only on PRs) so artifacts that already built on main come from cache
      # instead of being re-fetched on every run.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The security invariants of the source tree (scripts/check_security_invariants.py): the
      # Myotis boundary, the mnemonic's one path, the key store's floors, the biometric keys'
      # parameters, the Android backup and signing rules, the screens under capture protection,
      # the workflows' pins and triggers, the build's repositories. Standard-library Python,
      # seconds, before the build. A violation the baseline (scripts/security-baseline.txt) does
      # not accept fails here; the baseline lists the open findings of the 2026-11-01 audit and
      # shrinks as they are fixed. The script's own tests run first, so a broken check cannot
      # pass silently.
      - name: Check security invariants
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_security_invariants.py'
          python3 scripts/check_security_invariants.py

      # The guard scripts/update_gradle_pins.sh runs before it takes new pins: a change to
      # gradle/verification-metadata.xml may only ADD entries (docs/gradle-dependency-pins.md).
      - name: Test the pins guard
        run: python3 -I scripts/test_check_pins_additive.py

      # The rules pr-scope.yml decides by, which paths build which image legs in the merge
      # queue, and ios.yml's targets job on a PR.
      # A slip there shows as a green, skipped check, so they are tested here, on every PR.
      - name: Test the PR scope rules
        run: python3 -I scripts/test_pr_scope.py

      # The built-in clear-signing catalog (data/.../clearsigning/ClearSigningCatalog.kt) is GENERATED from the
      # ERC-7730 descriptors vendored under scripts/clear-signing/registry/, each pinned by its sha256, and the
      # curated list with its code hashes (scripts/clear-signing/contracts.json; docs/clear-signing.md, A1).
      # Its tests first, then the generator, which refuses a moved pin or anything the runtime does not
      # implement; then the drift gate, as for the icons below. Standard-library Python, seconds.
      - name: Verify the clear-signing catalog
        run: |
          python3 -I scripts/clear-signing/test_generate.py
          python3 -I scripts/clear-signing/generate.py
          out="data/src/commonMain/kotlin/eth/serotine/data/clearsigning"
          git diff --exit-code -- $out \
            && test -z "$(git status --porcelain -- $out)" || {
            git status --porcelain -- $out
            echo "::error::the clear-signing catalog in $out is STALE —" \
                 "regenerate with \`python3 -I scripts/clear-signing/generate.py\` and commit what it writes."
            exit 1
          }

      # The Android launcher icon is GENERATED from assets/serotine_logo.svg and committed
      # (android-app/src/main/res: ic_launcher_foreground, ic_launcher_background,
      # mipmap-anydpi-v26/ic_launcher; android-app/src/debug/res: the debug app's recoloured
      # icon over the same names), and the desktop and iOS icons are rendered from it at build
      # time (scripts/gen_app_icons.java). Re-run the generator (stdlib-only, seconds) and fail
      # on a diff, so a hand edit to the resources, or an SVG change without a re-run, cannot
      # drift past review. `git diff` alone is blind to an UNTRACKED file (a new or renamed
      # generator output nobody committed), hence the porcelain check behind it.
      - name: Verify generated Android icons match assets/serotine_logo.svg
        run: |
          python3 scripts/gen_android_icons.py
          res="android-app/src/main/res android-app/src/debug/res"
          git diff --exit-code -- $res \
            && test -z "$(git status --porcelain -- $res)" || {
            git status --porcelain -- $res
            echo "::error::the icons in $res are STALE vs assets/serotine_logo.svg —" \
                 "regenerate with \`python3 scripts/gen_android_icons.py\` and commit every file it writes."
            exit 1
          }

      # The rate widget's asset icons (android-app/src/main/res/drawable/ic_widget_asset_*.xml)
      # and their lookup (android-app/.../widget/WidgetAssetIcons.kt) are GENERATED from
      # ui/.../TokenIcons.kt, since RemoteViews cannot draw a Compose ImageVector directly
      # (scripts/gen_widget_icons.py). Same drift gate as the launcher icon above: re-run and
      # fail on a diff, so a hand edit, or a TokenIcons.kt change without a re-run, cannot drift
      # past review.
      - name: Verify generated widget icons match TokenIcons.kt
        run: |
          python3 scripts/gen_widget_icons.py
          res="android-app/src/main/res/drawable android-app/src/main/kotlin/eth/serotine/android/widget/WidgetAssetIcons.kt"
          git diff --exit-code -- $res \
            && test -z "$(git status --porcelain -- $res)" || {
            git status --porcelain -- $res
            echo "::error::the widget icons in $res are STALE vs TokenIcons.kt —" \
                 "regenerate with \`python3 scripts/gen_widget_icons.py\` and commit every file it writes."
            exit 1
          }

      # The ubuntu-latest runner ships an Android SDK via $ANDROID_HOME, which
      # AGP picks up automatically when local.properties is absent.
      #
      # `build` = every module's assemble + check: the JVM and Android unit tests
      # of :domain, :data and :ui (the headless Compose UI tests among them),
      # Android lint, and the debug + release APK assembly. The installers and
      # the APK gates are the artifact workflows' job (android-apk.yml and the
      # three desktop-*.yml).
      #
      # Retry to ride out transient repository-resolution blips. NOT --offline:
      # offline turns a single cache miss into a hard failure.
      - name: Build with Gradle
        run: |
          for attempt in 1 2 3; do
            ./gradlew build && exit 0
            echo "::warning::Gradle build attempt $attempt failed; retrying in 25s (transient dependency resolution?)"
            sleep 25
          done
          echo "::error::Gradle build failed after 3 attempts"
          exit 1

      # The test reports, for a red run: JUnit XML + HTML per module.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  # The vendored ERC-7730 descriptors against the registry's own checks (docs/clear-signing.md, A1, step 3):
  # the pinned v2 schema (check-jsonschema, the version the registry's CI pins) and the registry's linter
  # (its pinned fork of python-erc7730). The app never runs Python; this is CI only. The linter reads
  # Sourcify's repository to compare each descriptor with the contract's verified ABI, so it needs the
  # network, and it reports missing formats as warnings, which do not fail the job. Its own job, so that an
  # outage there does not hold up Build and Test, which is the required check.
  clear-signing:
    name: Clear-signing descriptors (schema + erc7730 lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No token left in .git/config: the linter's dependencies are installed by version, not by hash.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the schema and lint
        working-directory: scripts/clear-signing/registry
        run: |
          python3 -m venv /tmp/erc7730
          /tmp/erc7730/bin/pip install --quiet check-jsonschema==0.38.0 \
            "erc7730 @ git+https://github.com/sourcifyeth/python-erc7730@ccd51ad544e6625d89564a79258fa4e8d0846cce"
          descriptors=$(find registry -name 'calldata-*.json' -o -name 'eip712-*.json' -o -name 'common-*.json' \
                        | grep -v -e /testsv2/ -e /sigs/ | sort)
          /tmp/erc7730/bin/check-jsonschema --schemafile specs/erc7730-v2.schema.json $descriptors
          /tmp/erc7730/bin/erc7730 lint $(echo "$descriptors" | grep -v /common-)
