# What a PR touches, so the macOS and APK builds run only where they can tell
# something (owner's request, 2026-11-18). A caller adds this as a job and tests
# its outputs in an `if:`:
#
#     scope:
#       name: PR scope
#       uses: ./.github/workflows/pr-scope.yml
#       permissions:
#         pull-requests: read
#     build:
#       needs: scope
#       if: ${{ !cancelled() && needs.scope.outputs.code != 'false' }}
#
# Callers: ios.yml, desktop-dmg.yml, android-apk.yml. Build and Test (ci.yml)
# and the Screenshots workflow run on every PR, whatever it touches.
#
# THE OUTPUTS, each 'true' or 'false':
# - code: the PR changes something besides docs (docs/, .claude/, website/,
#   LICENSE, a *.md outside a source set). No build reads those; ci.yml still
#   runs on such a PR.
# - dmg: the PR changes the desktop packaging or the build: desktop-app/, the
#   app icon's sources (scripts/gen_app_icons.java and the two Android
#   launcher files desktop-app/build.gradle.kts reads), gradle/, a
#   *.gradle.kts, a lockfile, the Gradle wrapper, desktop-dmg.yml, the review
#   gate it calls, this file. These are what broke the dmg leg on PRs before.
# - ios_device: the PR changes the iOS host or the build: ios-app/, a cinterop
#   definition (src/nativeInterop/), gradle/, a *.gradle.kts, a lockfile, the
#   Gradle wrapper, ios.yml, this file. These are the inputs of the device
#   link, which a PR otherwise leaves to main.
# On every event but pull_request, all three are 'true'. The label `full-ci`
# on the PR makes all three 'true' too. The label is read from the API when
# the job runs, not from the event, so adding it and then pushing, or *Re-run
# all jobs* on the run, builds everything. (*Re-run failed jobs* leaves a
# skipped job skipped.)
#
# The file list is the PR's whole diff against its base, as GitHub lists it,
# renames counted by their old path as well as their new one.
#
# FAIL-OPEN. It may only skip work, never lose a check by accident. An API
# error, a file list that does not match the PR's file count, or GitHub's
# 3000-file cap all end in 'true' for every output and a warning. A job that
# fails anyway leaves the outputs empty, and the callers test `!= 'false'`, so
# empty runs everything. `continue-on-error` keeps such a failure from skipping
# the jobs that need this one, and the ones behind those: a job's implicit
# success() looks at every job up its `needs:` chain. The review gate has the
# same exposure and the same guard.
#
# A CALLER'S `if:` MUST BE TRUE ON EVERY EVENT BUT pull_request, as for the
# review gate (wait-for-claude-review.yml): a skipped job skips the release
# uploads behind it on a tag. The outputs are 'true' there, so a test of them
# is safe; a test of anything else is the caller's to prove.
name: PR scope

on:
  workflow_call:
    outputs:
      code:
        description: "'false' when the PR changes only docs"
        value: ${{ jobs.scope.outputs.code }}
      dmg:
        description: "'false' when the PR changes neither the desktop packaging nor the build"
        value: ${{ jobs.scope.outputs.dmg }}
      ios_device:
        description: "'false' when the PR changes neither the iOS host nor the build"
        value: ${{ jobs.scope.outputs.ios_device }}

jobs:
  scope:
    name: What the PR changes
    runs-on: ubuntu-latest
    # See FAIL-OPEN above.
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      dmg: ${{ steps.scope.outputs.dmg }}
      ios_device: ${{ steps.scope.outputs.ios_device }}
    steps:
      - name: List the PR's files and labels
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          FULL_LABEL = "full-ci"
          DOCS_DIRS = ("docs/", ".claude/", "website/")
          DOCS_FILES = {"LICENSE"}
          BUILD_DIRS = ("gradle/",)
          BUILD_FILES = {"gradlew", "gradlew.bat", "gradle.properties", ".github/workflows/pr-scope.yml"}
          DMG_DIRS = ("desktop-app/",)
          DMG_FILES = {
              ".github/workflows/desktop-dmg.yml",
              ".github/workflows/wait-for-claude-review.yml",
              "scripts/gen_app_icons.java",
              "android-app/src/main/res/drawable/ic_launcher_foreground.xml",
              "android-app/src/main/res/values/ic_launcher_background.xml",
          }
          IOS_DIRS = ("ios-app/",)
          IOS_FILES = {".github/workflows/ios.yml"}

          def write(reason, **flags):
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  for key, value in flags.items():
                      out.write(f"{key}={'true' if value else 'false'}\n")
              lines = [reason, ""] + [f"- {key}: {'true' if value else 'false'}" for key, value in flags.items()]
              print("\n".join(lines))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("\n".join(lines) + "\n")
              sys.exit(0)

          def everything(reason, warn=False):
              if warn:
                  print(f"::warning title=PR scope::{reason} Running every build.")
              write(reason, code=True, dmg=True, ios_device=True)

          if os.environ["EVENT_NAME"] != "pull_request":
              everything(f"Not a PR ({os.environ['EVENT_NAME']}): every build runs.")

          repo = os.environ["GITHUB_REPOSITORY"]
          number = os.environ.get("PR_NUMBER", "")
          if not number.isdigit():
              everything(f"Unexpected PR number '{number}'.", warn=True)

          def gh(*args):
              return subprocess.run(["gh", "api", *args], check=True, capture_output=True, text=True, timeout=120).stdout

          try:
              pr = json.loads(gh(f"repos/{repo}/pulls/{number}"))
              labels = {label["name"] for label in pr["labels"]}
              expected = int(pr["changed_files"])
              # One JSON array per line, so no character of a path needs escaping.
              rows = [json.loads(line) for line in gh(
                  "--paginate", f"repos/{repo}/pulls/{number}/files?per_page=100",
                  "--jq", '.[] | [.filename, .previous_filename // ""]').splitlines()]
          except Exception as error:  # every way out runs the builds (FAIL-OPEN)
              everything(f"Reading the PR from the API failed ({error}).", warn=True)

          if FULL_LABEL in labels:
              everything(f"The PR carries the label `{FULL_LABEL}`: every build runs.")
          if not rows or len(rows) != expected or len(rows) >= 3000:
              everything(f"The API listed {len(rows)} files for a PR of {expected}.", warn=True)

          paths = {path for row in rows for path in row if path}

          def under(path, dirs, files):
              return path.startswith(dirs) or path in files

          def build(path):
              return under(path, BUILD_DIRS, BUILD_FILES) or path.endswith((".gradle.kts", ".lockfile"))

          def docs(path):
              # A *.md in a source set may be a resource the app ships.
              return under(path, DOCS_DIRS, DOCS_FILES) or (path.endswith(".md") and "/src/" not in path)

          def ios_device(path):
              return build(path) or under(path, IOS_DIRS, IOS_FILES) or "/src/nativeInterop/" in path

          write(
              f"{len(rows)} files changed.",
              code=any(not docs(path) for path in paths),
              dmg=any(build(path) or under(path, DMG_DIRS, DMG_FILES) for path in paths),
              ios_device=any(ios_device(path) for path in paths),
          )
          PY
