# The Punicus website (website/): built on every pull request, published to GitHub Pages from main.
# What the site is, how it is built and what it must stay free of: website/README.md and the header
# of scripts/build_website.py.
#
# `build` runs the script's tests, then builds the site into one self-contained folder and uploads
# it as the Pages artifact. It runs on every pull request too, without publishing: a page shows the
# app's screens from docs/screenshots/, so a PR that renames or removes a screen or a state the
# site shows fails here, and the artifact lets a reviewer look at the built site.
#   - The newest release's files are linked directly from the download section. They are read from
#     GitHub's API here, at build time, so the published page asks GitHub nothing in a visitor's
#     browser. Pre-releases count: every release so far is one. When the API cannot be read, a
#     pull request's build links the releases page instead, with a warning; a build that would be
#     published fails, so that what is published keeps its links.
#   - The site's public address, for the social preview image's absolute URL, is SITE_URL:
#     https://punicus.eth.limo/ (the owner's, 2026-11-25), not the Pages address, which moved with the
#     repository (biafra23.github.io/punicus became a 404). Whether Pages is turned on is still asked of
#     the repository's Pages settings: where it is not (a fork, or this repository before the owner has
#     turned it on), the site is built without the address, and the job says so.
# `deploy` publishes that artifact, on main only and only where Pages is turned on: elsewhere it
# is skipped, not failed. It runs none of the repository's code, and it alone holds the two
# permissions a Pages deployment takes.
#
# Triggers:
#   - a push to main, and every pull request (unscoped, any base branch, as ci.yml's);
#   - once a day: a release's files are uploaded by the tag's workflows, after which nothing is
#     pushed to main, and a release made with GITHUB_TOKEN starts no workflow. The daily run is what
#     brings a new release's links onto the page;
#   - by hand (workflow_dispatch), to publish right after a release.
#
# Pages must be turned on once, by the owner: Settings > Pages > Source: GitHub Actions. Until then
# `deploy` is skipped and `build` warns that nothing is published.
#
# No PR-controlled value reaches a `run:` script (WF-RUN-INJECTION), and every action is pinned to
# a commit (WF-SHA-PIN); scripts/check_security_invariants.py checks both.
name: Website

on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

# One deployment at a time, never cancelled half way; a PR's newer push replaces its older run.
# Only main's runs share the `publish` group. A run started by hand on another branch publishes
# nothing, and in that group it would take the place of a main run waiting its turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.build.outputs.pages }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Test the build script
        run: python3 -m unittest discover -s scripts -p 'test_build_website.py'

      - name: Build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          # The site's public address (owner's, 2026-11-25): what its links and its preview image name.
          SITE_URL: https://punicus.eth.limo/
        run: |
          releases="$RUNNER_TEMP/releases.json"
          if ! gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > "$releases"; then
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              echo "::error::The releases could not be read. Nothing is published without their links."
              exit 1
            fi
            echo "::warning::The releases could not be read: this build links the releases page instead."
            releases=""
          fi
          # On an error gh prints the error's JSON, not an address: only an https address counts.
          base_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)
          case "$base_url" in
            https://*)
              echo "pages=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              base_url=""
              echo "pages=false" >> "$GITHUB_OUTPUT"
              if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
                echo "::warning::GitHub Pages is not turned on (Settings > Pages > Source: GitHub Actions): the site is built and not published."
              fi
              ;;
          esac
          # Pages on: the site is published, under its public address, not the Pages one.
          python3 scripts/build_website.py --out build/website \
            ${releases:+--releases "$releases"} --base-url "${base_url:+$SITE_URL}"

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/website

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
