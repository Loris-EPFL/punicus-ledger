<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">To open a stored key, Punicus needs three things</title>
  <desc id="desc">The wallet password, kept in your head; a hardware key, kept in this device's security chip; and the envelope file, kept on this device's storage. Together they open the seed for one signature, inside the app, and it is wiped right after. On Windows and Linux the password alone protects the file for now.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="438" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="46" font-size="20" font-weight="700" fill="#1f2328">To open a stored key, Punicus needs all three</text>

  <!-- 1: the password -->
  <rect x="32" y="76" width="280" height="196" rx="12" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="52" y="104" font-size="13" font-weight="700" fill="#3b6fd8">IN YOUR HEAD</text>
  <text x="52" y="134" font-size="18" font-weight="700" fill="#1f2328">Your wallet password</text>
  <text x="52" y="164" font-size="14" fill="#1f2328">Never stored anywhere.</text>
  <text x="52" y="184" font-size="14" fill="#1f2328">Typed when you sign.</text>
  <text x="52" y="214" font-size="13" fill="#57606a">A fingerprint or face can</text>
  <text x="52" y="232" font-size="13" fill="#57606a">stand in for it, with a second</text>
  <text x="52" y="250" font-size="13" fill="#57606a">chip key, if you turn that on.</text>

  <!-- 2: the chip -->
  <rect x="340" y="76" width="280" height="196" rx="12" fill="#f3eefe" stroke="#6d4bd1" stroke-width="1.5"/>
  <text x="360" y="104" font-size="13" font-weight="700" fill="#6d4bd1">IN THIS DEVICE'S SECURITY CHIP</text>
  <text x="360" y="134" font-size="18" font-weight="700" fill="#1f2328">A hardware key</text>
  <text x="360" y="164" font-size="14" fill="#1f2328">Made inside the chip;</text>
  <text x="360" y="184" font-size="14" fill="#1f2328">it never leaves it.</text>
  <text x="360" y="214" font-size="13" fill="#57606a">Android: StrongBox or the TEE</text>
  <text x="360" y="232" font-size="13" fill="#57606a">iPhone, iPad, Mac:</text>
  <text x="360" y="250" font-size="13" fill="#57606a">the Secure Enclave</text>

  <!-- 3: the file -->
  <rect x="648" y="76" width="280" height="196" rx="12" fill="#fff7e6" stroke="#c98a00" stroke-width="1.5"/>
  <text x="668" y="104" font-size="13" font-weight="700" fill="#9a6700">ON THIS DEVICE'S STORAGE</text>
  <text x="668" y="134" font-size="18" font-weight="700" fill="#1f2328">The envelope file</text>
  <text x="668" y="164" font-size="14" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;address&gt;.seed</text>
  <text x="668" y="184" font-size="14" fill="#1f2328">Your seed, encrypted.</text>
  <text x="668" y="214" font-size="13" fill="#57606a">Never in a cloud backup or</text>
  <text x="668" y="232" font-size="13" fill="#57606a">a phone-to-phone transfer.</text>
  <text x="668" y="250" font-size="13" fill="#57606a">Useless without the other two.</text>

  <!-- arrows into the result -->
  <line x1="172" y1="272" x2="300" y2="322" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="272" x2="480" y2="322" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="788" y1="272" x2="660" y2="322" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="324" width="560" height="64" rx="12" fill="#e9f7ef" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="480" y="351" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Together: the seed opens for one signature,</text>
  <text x="480" y="373" font-size="15" fill="#1f2328" text-anchor="middle">inside the app, and is wiped right after.</text>

  <text x="32" y="420" font-size="13" fill="#57606a">Windows and Linux: Punicus does not use the computer's TPM yet, so there the password alone protects the file.</text>
</svg>
