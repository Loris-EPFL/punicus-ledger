# Required by the Compose / Activity artifacts pulled in by :android-app.
android.useAndroidX=true

# Dexing the AndroidX + Compose classpath overflows the default 512m heap.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

# The shared modules declare the iOS targets from day one, so nothing
# JVM-only creeps into commonMain before the iOS host exists. Kotlin/Native
# can only build them on macOS; on Linux and Windows those targets are
# disabled, and this keeps the build quiet about it instead of warning on
# every invocation.
kotlin.native.ignoreDisabledTargets=true

# :data's iosMain uses the Myotis engine's iOS module (eth.myotis:myotis-engine-ios), whose
# own iosMain is built on cinterop declarations: commonized, they resolve in a shared iosMain
# (Myotis's docs/android-library.md, *iOS*).
kotlin.mpp.enableCInteropCommonization=true

# Lint from AGP 9.5.1 in place of AGP 8.13's own, as Myotis ran a newer lint while its AGP
# lagged its Kotlin (until its #837). AGP 8.13's lint is built on the Kotlin 2.2 analysis
# API: on Kotlin 2.4 it cannot read the stdlib's or our modules' metadata, resolves types
# wrongly, and reported a remember {} that returns a PreviewView as returning Unit
# (RememberReturnType, the `gradle pins` run of the Kotlin 2.4 bump). AGP 9.5.1's lint reads
# Kotlin 2.4. Drop this with the move to AGP 9.
android.experimental.lint.version=9.5.1

# No SwiftPM import (Kotlin 2.4's swiftPMDependencies {}): nothing here imports a Swift
# package; the iOS app links the framework through embedAndSignAppleFrameworkForXcode. Left
# on, KGP 2.4 makes its configurations on every KMP project, one of them on a Mac only, which
# the lockfiles written on Linux cannot hold.
kotlin.disableSwiftPMImport=true

kotlin.code.style=official
