# Toolchain pins. Kotlin and Compose MIRROR biafra23/myotis's
# (gradle/libs.versions.toml there) on purpose: Punicus embeds the Myotis engine
# library, and one known-good Kotlin/Compose stack shared by the two repositories
# means the library's Kotlin metadata never runs ahead of the host's compiler.
# Bump both together.
[versions]
# AGP 9.5 (with Gradle 9.9, gradle/wrapper), as Myotis since its #837: its bundled
# R8 and lint read Kotlin 2.4 metadata and sources. AGP 9 has built-in Kotlin (no
# org.jetbrains.kotlin.android plugin) and gives the KMP modules (:data, :ui) their
# own Android target plugin, com.android.kotlin.multiplatform.library, in place of
# com.android.library + androidTarget(). It needs Gradle 9.6 or newer.
agp = "9.5.1"
# Kotlin 2.4.21: Myotis's own pin since its #837, and the engine library is built with
# it from Myotis 0.1.21 on (the `myotis` pin below is still 0.1.20, which 2.4 reads);
# a host compiler older than the library's metadata cannot read it. (2.2.21 was the floor
# for the iOS target on Xcode 26.) Compose Multiplatform 1.12.x pairs with it, and
# brings androidx Compose 1.12, which needs AGP 9.1+ and compileSdk 37.
kotlin = "2.4.21"
compose-multiplatform = "1.12.2"
# The multiplatform lifecycle (ViewModel + collectAsStateWithLifecycle). 2.9.6 is
# the JetBrains lifecycle Compose Multiplatform 1.12.2's own artifacts depend on (as
# 1.9.3's did) — pin the same so the two never resolve apart. On Android, Compose's
# androidx artifacts bring androidx lifecycle 2.11, which the Android variant resolves.
lifecycle = "2.9.6"
activity-compose = "1.9.3"
# QR code scanning on Android (Connect a dApp): CameraX shows the camera and hands its frames to
# ZXing, which decodes them on the device. No Google Play services and nothing sent anywhere:
# ML Kit's scanner would tie the app to Google's. CameraX 1.4 builds against compileSdk 35.
camerax = "1.4.2"
zxing = "3.5.3"
kotlinx-coroutines = "1.10.2"
# desugar_jdk_libs 2.1.5: the minSdk-29 JDK-API budget in .claude/rules/platform.md
# was verified against this release's config.
desugar-jdk-libs = "2.1.5"
# Multiplatform navigation: JetBrains' build of androidx.navigation. 2.9.2 is built
# against lifecycle 2.9.6, the pin above, and Compose Multiplatform 1.9.3, which
# 1.12.2 supersedes; 2.10 moves to lifecycle 2.11, so nothing in 2.9.2's graph
# resolves past the pins.
navigation-compose = "2.9.2"
# The Material icons stopped at 1.7.3 upstream; Compose Multiplatform 1.12.x still
# consumes that release (material3 no longer brings it along).
material-icons-core = "1.7.3"
# ACINQ's Kotlin Multiplatform binding of bitcoin-core's libsecp256k1: JNI on
# Android and the JVM, cinterop on iOS — the native secp256k1 that
# docs/keys-and-signing.md (rule 7) requires. 0.22.0 is built with Kotlin 2.2.21,
# which the 2.4 compiler reads; moving it is a change of its own.
secp256k1-kmp = "0.22.0"
# The persistent account list (eth.serotine.data.account): multiplatform file I/O and
# JSON. kotlinx-io 0.8.2 is built for Kotlin 2.2, which the 2.4 compiler reads.
# kotlinx-serialization 1.12.0 is the release Myotis's iOS module depends on from
# 0.1.21 (the engine pin below moves there next), so every target resolves the same one; the serialization compiler
# plugin is Kotlin's own, at the Kotlin pin.
kotlinx-io = "0.8.2"
kotlinx-serialization = "1.12.0"
# The key envelope's Argon2id (docs/keys-and-signing.md, rule 2), from libsodium (the
# owner's choice, 2026-10-16). The bindings ship libsodium for Android (an AAR), the
# desktop JVM (macOS universal, Linux x64/arm64, Windows x64) and iOS; the envelope
# calls crypto_pwhash through its own byte-array JNA mapping instead of the bindings'
# String API (eth.serotine.data.keys.Sodium explains why). Built against Kotlin 1.9.23.
libsodium = "0.9.5"
# JNA, which libsodium is reached through on Android and the JVM: compiled against only
# (the bindings bring it at runtime, as the JNA AAR on Android). 5.18.1 is exactly the
# version the Myotis engine library pins with a strict constraint: the two move together.
jna = "5.18.1"
# The embedded Myotis engine (docs/embedding-myotis.md), from the filtered `maven-repo`
# repository in settings.gradle.kts. One version for the engine and the desktop's
# eth.myotis:myotis-engine-natives-<platform> (desktop-app/build.gradle.kts): a host library
# from another release would load and run that release's engine without a word.
myotis = "0.1.20"
# KotlinCrypto: pure-Kotlin multiplatform digests and MACs (Keccak-256 for
# addresses, SHA-256 for the BIP-39 checksum, HMAC-SHA512 for BIP-39/BIP-32).
# 0.8.0 needs a Kotlin 2.2.20 stdlib, below our pin.
kotlincrypto = "0.8.0"
# Ktor, the app's one HTTP client (CLAUDE.md, *Platform & language direction*), used only
# for CoW Protocol's order API (docs/swaps.md, *What CoW learns*). 3.3.3 is built with
# Kotlin 2.2.21 and coroutines 1.10.2, both of which still hold; moving it is a change of
# its own. Engines: CIO (Ktor's own, no OkHttp beneath it) on Android and the desktop,
# Darwin (NSURLSession) on iOS; neither retries a request behind the caller's back.
ktor = "3.3.3"

[plugins]
android-application    = { id = "com.android.application",                 version.ref = "agp" }
# AGP 9's Android target for the Kotlin Multiplatform modules (:data, :ui), in place of
# com.android.library + androidTarget() there.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
# The KMP Android library plugin registers no lint tasks of its own: the standalone lint
# plugin gives :data and :ui their Android lint again.
android-lint           = { id = "com.android.lint",                        version.ref = "agp" }
kotlin-jvm             = { id = "org.jetbrains.kotlin.jvm",                version.ref = "kotlin" }
kotlin-multiplatform   = { id = "org.jetbrains.kotlin.multiplatform",      version.ref = "kotlin" }
compose-compiler       = { id = "org.jetbrains.kotlin.plugin.compose",     version.ref = "kotlin" }
compose-multiplatform  = { id = "org.jetbrains.compose",                   version.ref = "compose-multiplatform" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing",   version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "kotlinx-coroutines" }
kotlinx-io-core            = { module = "org.jetbrains.kotlinx:kotlinx-io-core",            version.ref = "kotlinx-io" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# org.jetbrains.androidx.*: JetBrains' multiplatform builds of the AndroidX lifecycle
# artifacts (the androidx.* coordinates are Android-only).
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "lifecycle" }
androidx-activity-compose  = { module = "androidx.activity:activity-compose",            version.ref = "activity-compose" }
androidx-camera-camera2    = { module = "androidx.camera:camera-camera2",                version.ref = "camerax" }
androidx-camera-lifecycle  = { module = "androidx.camera:camera-lifecycle",              version.ref = "camerax" }
androidx-camera-view       = { module = "androidx.camera:camera-view",                   version.ref = "camerax" }
zxing-core                 = { module = "com.google.zxing:core",                         version.ref = "zxing" }
desugar-jdk-libs           = { module = "com.android.tools:desugar_jdk_libs",            version.ref = "desugar-jdk-libs" }
navigation-compose         = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
# The multiplatform BackHandler; already in every build through navigation-compose.
compose-ui-backhandler     = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }
material-icons-core        = { module = "org.jetbrains.compose.material:material-icons-core",   version.ref = "material-icons-core" }
# The secp256k1 API, plus one JNI binding per JVM platform (see data/build.gradle.kts).
secp256k1-kmp              = { module = "fr.acinq.secp256k1:secp256k1-kmp",             version.ref = "secp256k1-kmp" }
secp256k1-kmp-jni-android  = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-android", version.ref = "secp256k1-kmp" }
secp256k1-kmp-jni-jvm      = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-jvm",     version.ref = "secp256k1-kmp" }
libsodium-bindings         = { module = "com.ionspin.kotlin:multiplatform-crypto-libsodium-bindings", version.ref = "libsodium" }
jna                        = { module = "net.java.dev.jna:jna",                         version.ref = "jna" }
myotis-engine              = { module = "eth.myotis:myotis-engine",                     version.ref = "myotis" }
# Not "myotis-engine-ios": an alias that extends another (myotis-engine) turns that one
# into a group, which the build files would then have to read with asProvider().
myotis-ios                 = { module = "eth.myotis:myotis-engine-ios",                 version.ref = "myotis" }
kotlincrypto-sha2          = { module = "org.kotlincrypto.hash:sha2",                   version.ref = "kotlincrypto" }
kotlincrypto-sha3          = { module = "org.kotlincrypto.hash:sha3",                   version.ref = "kotlincrypto" }
kotlincrypto-hmac-sha2     = { module = "org.kotlincrypto.macs:hmac-sha2",              version.ref = "kotlincrypto" }
ktor-client-core           = { module = "io.ktor:ktor-client-core",                     version.ref = "ktor" }
ktor-client-cio            = { module = "io.ktor:ktor-client-cio",                      version.ref = "ktor" }
ktor-client-darwin         = { module = "io.ktor:ktor-client-darwin",                   version.ref = "ktor" }
ktor-client-mock           = { module = "io.ktor:ktor-client-mock",                     version.ref = "ktor" }
